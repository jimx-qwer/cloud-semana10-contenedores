services:

  # BASE DE DATOS POSTGRESQL
  db:
    image: postgres:17.6
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DEMO_USER1: ${DEMO_USER1}
      DEMO_PASSWORD1: ${DEMO_PASSWORD1}
      DEMO_NAME1: ${DEMO_NAME1}
      DEMO_USER2: ${DEMO_USER2}
      DEMO_PASSWORD2: ${DEMO_PASSWORD2}
      DEMO_NAME2: ${DEMO_NAME2}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    networks:
      - red_backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10


  # APLICACION WEB FLASK
  app:
    build:
      context: ./app

    image: cloudaccess-app:1.0.0
    platform: linux/amd64
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    networks:
      - red_frontend
      - red_backend


  # PROXY INVERSO NGINX
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - red_frontend


# ALMACENAMIENTO PERSISTENTE
volumes:
  postgres_data:


# REDES INTERNAS
networks:
  red_frontend:
    driver: bridge

  red_backend:
    driver: bridge
    internal: true